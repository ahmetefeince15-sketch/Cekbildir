<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>ÇekBildir</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        
        <!-- Mevcut tema CSS dosyası -->
        <link href="css/styles.css" rel="stylesheet" />
        
        <!-- Leaflet Harita CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        
        <!-- Özel CSS dosyan -->
        <link href="style.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <!-- Üst Menü -->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand text-dark fw-bold" href="index.html">ÇekBildir</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Harita Üzeri Arama Kutusu ve Konumum Butonu -->
        <div class="arama-kutusu-wrapper">
            <div class="input-group shadow">
                <input type="text" id="il-ilce-input" class="form-control border-0 py-2" placeholder="İl ve ilçe girin (Örn: Elazığ/Palu)" aria-label="İl ve ilçe">
                <button class="btn btn-primary px-3" type="button" id="konum-ara-btn">
                    <i class="fas fa-search"></i> Git
                </button>
                <button class="btn btn-success px-3" type="button" id="mevcut-konum-btn" title="Mevcut Konumuma Git">
                    <i class="fas fa-location-crosshairs"></i> Konumum
                </button>
            </div>
        </div>

        <!-- Tam Ekran Harita -->
        <div id="map"></div>

        <!-- Konuma Tıklandığında Açılan Sorun Bildir Paneli -->
        <div id="sorun-bildir-panel" class="card shadow-lg border-0 d-none" style="position: fixed; top: 85px; right: 20px; width: 360px; max-width: calc(100vw - 40px); z-index: 1050; border-radius: 14px;">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3 px-3" style="border-radius: 14px 14px 0 0;">
                <h6 class="mb-0 fw-bold">
                    <i class="fas fa-exclamation-circle text-warning me-2"></i>Sorun Bildir
                </h6>
                <button type="button" id="sorun-kapat-btn" class="btn-close btn-close-white" aria-label="Kapat"></button>
            </div>

            <div class="card-body p-3">
                <div class="small text-muted mb-2">
                    <i class="fas fa-map-marker-alt text-danger me-1"></i>
                    <span id="bildirim-koordinat-metni">Konum seçilmedi</span>
                </div>

                <!-- Deniz / Su Alanı Uyarısı ve Seçeneği -->
                <div id="deniz-uyari-kutusu" class="alert alert-warning py-2 px-3 small d-none mb-3" role="alert">
                    <div class="fw-semibold mb-1">
                        <i class="fas fa-water me-1"></i>Deniz / Su Alanı Algılandı
                    </div>
                    <div class="mb-2" style="line-height: 1.35;">
                        Seçilen nokta deniz veya su alanında görünüyor. İsterseniz bunu <strong>Deniz / Kıyı Bildirimi</strong> olarak gönderebilir veya kara üzerinden başka bir nokta seçebilirsiniz.
                    </div>
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="deniz-bildirimi-onay">
                        <label class="form-check-label fw-semibold" for="deniz-bildirimi-onay">
                            Deniz / Kıyı Bildirimi olarak gönder
                        </label>
                    </div>
                </div>

                <!-- Yöntem 1: Fotoğraf Ekle -->
                <div class="mb-3 p-2 border rounded-3 bg-light">
                    <label for="sorun-fotograf-input" class="form-label fw-semibold small mb-1 d-block">
                        <i class="fas fa-camera text-primary me-1"></i>Fotoğraf Ekle
                    </label>
                    <input type="file" id="sorun-fotograf-input" class="form-control form-control-sm" accept="image/*" capture="environment">
                    <div id="fotograf-onizleme-kutusu" class="mt-2 d-none text-center">
                        <img id="fotograf-onizleme-img" src="" alt="Seçilen fotoğraf" class="img-fluid rounded" style="max-height: 150px; object-fit: cover;">
                        <button type="button" id="fotograf-kaldir-btn" class="btn btn-sm btn-outline-danger mt-2 py-0 px-2">
                            <i class="fas fa-trash-alt me-1"></i>Fotoğrafı Kaldır
                        </button>
                    </div>
                </div>

                <!-- Yöntem 2: Yazı Ekle -->
                <div class="mb-3 p-2 border rounded-3 bg-light">
                    <label for="sorun-yazi-input" class="form-label fw-semibold small mb-1 d-block">
                        <i class="fas fa-pen text-success me-1"></i>Yazı Ekle
                    </label>
                    <textarea id="sorun-yazi-input" class="form-control form-control-sm" rows="3" placeholder="Gördüğünüz sorunu kısaca yazın..."></textarea>
                </div>

                <button type="button" id="sorun-gonder-btn" class="btn btn-primary w-100 fw-semibold">
                    <i class="fas fa-paper-plane me-1"></i>Bildirimi Gönder
                </button>
            </div>
        </div>

        <!-- Uydu / Harita Geçiş Butonu -->
        <button id="katman-degistir-btn" class="btn btn-light shadow katman-butonu" type="button">
          <i class="fas fa-satellite"></i> Uydu Görünümü
        </button>

        <!-- Alt Konum Etiketi -->
        <div class="alt-bilgi-wrapper">
            <span id="secilen-konum" class="badge bg-dark text-white px-3 py-2 fs-6">
                Konum alınıyor...
            </span>
        </div>

        <!-- Bootstrap ve Tema JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        
        <!-- Leaflet Harita JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        
        <!-- Özel Harita JS Dosyan -->
        <script src="script.js"></script>
    </body>
</html>
