<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>ÇekBildir</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        
        <!-- Mevcut tema CSS dosyası -->
        <link href="css/styles.css" rel="stylesheet" />
        
        <!-- Leaflet Harita CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        
        <!-- Özel CSS dosyan -->
        <link href="style.css" rel="stylesheet" />
    </head>
    <body id="page-top">
        <!-- Üst Menü -->
        <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand text-dark fw-bold" href="index.html">ÇekBildir</a>
                <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </nav>

        <!-- Harita Üzeri Arama Kutusu ve Konumum Butonu -->
        <div class="arama-kutusu-wrapper">
            <div class="input-group shadow">
                <input type="text" id="il-ilce-input" class="form-control border-0 py-2" placeholder="İl ve ilçe girin (Örn: Beşiktaş, İstanbul)" aria-label="İl ve ilçe">
                <button class="btn btn-primary px-3" type="button" id="konum-ara-btn">
                    <i class="fas fa-search"></i> Git
                </button>
                <button class="btn btn-success px-3" type="button" id="mevcut-konum-btn" title="Mevcut Konumuma Git">
                    <i class="fas fa-location-crosshairs"></i> Konumum
                </button>
            </div>
        </div>

        <!-- Tam Ekran Harita -->
        <div id="map"></div>
        <!-- Uydu / Harita Geçiş Butonu -->
        <button id="katman-degistir-btn" class="btn btn-light shadow katman-butonu" type="button">
          <i class="fas fa-satellite"></i> Uydu Görünümü
        </button>

        <!-- Alt Konum Etiketi -->
        <div class="alt-bilgi-wrapper">
            <span id="secilen-konum" class="badge bg-dark text-white px-3 py-2 fs-6">
                Konum alınıyor...
            </span>
        </div>

        <!-- Bootstrap ve Tema JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
        
        <!-- Leaflet Harita JS -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        
        <!-- Özel Harita JS Dosyan -->
        <script src="script.js"></script>
    </body>
</html>
